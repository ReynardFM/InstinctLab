  :root {
    --scope: #1e2b34;     /* microscope surround */
    --scope-2: #26363f;
    --agar: #e8dda4;      /* the culture plate */
    --agar-edge: #cbbd7c;
    --glass: #f2f5f0;     /* slides: cards, panels */
    --glass-edge: #b9c6c3;
    --ink: #1b262c;
    --muted: #5b6b70;
    --light: #dfe7e3;     /* text on the scope */
    --dim: #93a6a8;
    --blue: #2f6db5;      /* methylene blue: your species, progress */
    --red: #c23b55;       /* safranin: danger, the pass bar, failure */
    --violet: #6e2a5e;    /* crystal violet: poison */
    --gold: #c79a2b;      /* iodine: DNA and creds */
    --green: #2f7d4a;
    --food: #fff8dc; --food-rim: #b9a24f; --hunter: #34405e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--scope); color: var(--light); font-family: "Recursive", system-ui, sans-serif; font-variation-settings: "CASL" 0; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #scope { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* annotations around the plate */
  .hud { position: fixed; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  #label { top: 14px; left: 16px; max-width: min(46vw, 420px); }
  #label .species { font-size: 22px; font-weight: 800; font-variation-settings: "CASL" 1; color: var(--light); }
  #label .where { font-size: 14px; color: var(--dim); margin-top: 2px; }
  #label .goal { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.35; }
  #purse { top: 14px; right: 16px; text-align: right; }
  #purse .dna { font-size: 22px; font-weight: 800; color: var(--gold); }
  #purse .creds { font-size: 14px; color: var(--dim); }
  #purse button { margin-top: 6px; background: transparent; border: 1px solid var(--scope-2); border-radius: 6px; padding: 3px 9px; font-size: 13px; color: var(--dim); }
  #readout { left: 16px; bottom: 16px; font-size: 14px; color: var(--dim); line-height: 1.5; max-width: 34vw; }
  #readout b { color: var(--light); font-size: 18px; }
  #powers { right: 16px; bottom: 14px; display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; }
  .power { background: rgba(38, 54, 63, .94); border: 1px solid #3a4c56; border-radius: 10px; padding: 6px 10px 5px; text-align: left; color: var(--light); }
  .power b { display: block; font-size: 14px; }
  .power small { color: var(--dim); font-size: 12px; }
  .power .cost { float: right; color: var(--gold); font-weight: 800; margin-left: 8px; }
  .power:disabled { opacity: .4; cursor: not-allowed; }
  .power.on { border-color: var(--gold); }

  /* slides: everything you choose is written on a glass slide */
  #sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 0); width: min(980px, 100vw); max-height: 78vh; overflow: auto;
    background: rgba(30, 43, 52, .92); border-top: 1px solid #3a4c56; border-radius: 16px 16px 0 0; padding: 16px 18px 20px; transition: transform .28s ease; }
  #sheet.hidden { transform: translate(-50%, 105%); }
  #sheet h2 { font-size: 20px; margin: 0 0 4px; font-variation-settings: "CASL" 1; font-weight: 800; }
  #sheet p { margin: 4px 0 10px; color: var(--dim); line-height: 1.45; max-width: 70ch; }
  .slides { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 10px 0 12px; }
  .slide { position: relative; text-align: left; background: var(--glass); color: var(--ink); border: 1px solid var(--glass-edge); border-radius: 6px; padding: 12px 12px 10px 18px; min-height: 104px; }
  .slide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; border-radius: 6px 0 0 6px; background: var(--tag, var(--blue)); }
  .slide b { display: block; font-size: 16px; font-variation-settings: "CASL" 1; }
  .slide .gain { display: block; margin-top: 5px; font-size: 13px; color: var(--green); }
  .slide .cost { display: block; margin-top: 2px; font-size: 13px; color: var(--red); }
  .slide .note { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .slide.picked { outline: 3px solid var(--gold); }
  .slide:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .go { background: var(--blue); border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 800; color: #fff; font-size: 16px; }
  .go:disabled { opacity: .45; cursor: not-allowed; }
  .plain { background: transparent; border: 1px solid #3a4c56; border-radius: 8px; padding: 9px 14px; color: var(--light); }
  .hint { background: rgba(199, 154, 43, .14); border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 0 6px 6px 0; color: var(--light) !important; font-variation-settings: "CASL" 1; }
  .verdict { font-size: 26px; font-weight: 800; font-variation-settings: "CASL" 1; }
  .verdict.pass { color: #7fc79a; } .verdict.fail { color: #ef7d93; }
  .reward { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 6px 0 4px; }
  @media (max-width: 640px) { .reward { grid-template-columns: 1fr; } }
  .reward label { font-size: 14px; display: block; }
  .reward label span { float: right; color: var(--light); font-weight: 700; }
  .reward small { color: var(--dim); display: block; font-size: 12px; }
  .reward input { width: 100%; accent-color: var(--blue); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #34454f; white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .warning { color: #ef7d93; font-weight: 800; font-size: 13px; margin-top: 4px; display: block; }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--glass); color: var(--ink); padding: 7px 14px; border-radius: 8px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 640px) {
    #label { max-width: 60vw; } #label .goal { display: none; }
    #readout { display: none; }
    #powers { left: 10px; right: 10px; max-width: none; justify-content: center; }
    .power { min-width: 0; flex: 1 1 40%; }
  }
  @media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
</style>
</head>
<body>

<div class="hud" id="powers"></div>
<section id="sheet" class="hidden" aria-live="polite"></section>
<div id="toast" role="status"></div>

  var toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => t.classList.remove("show"), 1600);
  }
  function renderAll() {
    renderHud();
    renderSheet();
  }
  renderAll();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
