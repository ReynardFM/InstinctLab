<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instinct Lab: Roguelite Demo</title>
<!-- DEMO (roguelite brief, 2026-10-29). Built by: npm run build-play -> proto/play.html (one self-contained file). -->
<style>
  :root {
    --bench: #cdd6d2; --paper: #fbfcf7; --ink: #1e2b30; --muted: #5d6c70; --line: #c9d2cf;
    --field: #e7e2b6; --food: #fff8dc; --food-rim: #b9a24f; --poison: #6e2a5e; --hunter: #34405e;
    --accent: #2b5c9e; --good: #2f7d4a; --warn: #c0152f;
    --eat: #2f7d4a; --avoid: #8e3fa0; --flee: #c0152f; --wander: #7d8a8c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bench); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width: 1120px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  header h1 { font-size: 22px; margin: 0; }
  header .wallet { margin-left: auto; font-weight: 700; font-size: 18px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
  h2:first-child { margin-top: 0; }
  h3 { margin: 0 0 4px; font-size: 18px; }
  #world { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: var(--field); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  button { font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .choice { text-align: left; padding: 10px 12px; border-radius: 9px; border: 2px solid var(--line); background: #fff; }
  .choice b { display: block; }
  .choice small { color: var(--muted); display: block; margin-top: 2px; }
  .choice.on { border-color: var(--accent); background: #eef3fa; }
  .choice.locked { opacity: .55; }
  .muted { color: var(--muted); }
  .slider label { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; margin: 6px 0; }
  .slider small { color: var(--muted); display: block; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .shop-item { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .shop-item:first-of-type { border-top: 0; }
  .warning { color: var(--warn); font-weight: 800; font-size: 13px; margin-top: 4px; }
  .stages { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  .stage-pill { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; background: #fff; }
  .stage-pill.now { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .stage-pill.pass { border-color: var(--good); color: var(--good); }
  .stage-pill.fail { border-color: var(--warn); color: var(--warn); }
  .verdict { font-size: 20px; font-weight: 800; margin: 4px 0; }
  .verdict.pass { color: var(--good); } .verdict.fail { color: var(--warn); }
  .reason { font-size: 16px; font-weight: 600; padding: 10px 12px; border-left: 4px solid var(--accent); background: #fff; border-radius: 0 8px 8px 0; margin: 8px 0; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
  @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); }
  #chart { width: 100%; height: 220px; display: block; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Instinct Lab</h1>
    <span class="muted">roguelite demo: pick a species, choose its senses and reward, let evolution do the rest</span>
    <span class="wallet" id="wallet"></span>
  </header>
  <div class="grid">
    <section class="card">
      <h2 id="watchTitle">World</h2>
      <canvas id="world" width="400" height="400"></canvas>
      <div class="legend">
        <span><i class="dot" style="background:var(--food);border:1px solid var(--food-rim)"></i>food</span>
        <span><i class="dot" style="background:var(--poison)"></i>poison</span>
        <span><i class="dot" style="background:var(--hunter);border-radius:0"></i>hunter</span>
        <span>creature doing: <i class="dot" style="background:var(--eat)"></i>eat <i class="dot" style="background:var(--avoid)"></i>avoid <i class="dot" style="background:var(--flee)"></i>flee <i class="dot" style="background:var(--wander)"></i>wander</span>
      </div>
      <div class="row">
        <span class="muted">Watch:</span>
        <button id="watchBest" class="on">best brain</button>
        <button id="watchBot">hand-written bot</button>
        <span class="muted">Speed:</span>
        <button id="speed">normal</button>
      </div>
      <p class="muted" id="watchNote"></p>
    </section>
    <section class="card" id="panel"></section>
  </div>
  <section class="card" style="margin-top:14px">
    <h2>This run</h2>
    <div class="tiles">
      <div class="tile"><span>Stage</span><b id="tStage">-</b></div>
      <div class="tile"><span>Generation</span><b id="tGen">-</b></div>
      <div class="tile"><span>Score (last 4 checks)</span><b id="tScore">-</b></div>
      <div class="tile"><span>Pass bar</span><b id="tBar">-</b></div>
    </div>
    <canvas id="chart"></canvas>
    <h2>Past runs</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Species</th><th>Seed</th><th>Senses</th><th>Stage scores</th><th>Cleared</th><th>Creds</th></tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
(() => {
  // src/engine/dmath.ts
  var HALF_PI_HI = 1.5707963267341256;
  var HALF_PI_LO = 6077100506506192e-26;
  var TWO_OVER_PI = 0.6366197723675814;
  var LN2_HI = 0.6931471803691238;
  var LN2_LO = 19082149292705877e-26;
  var INV_LN2 = 1.4426950408889634;
  var SQRT_HALF = 0.7071067811865476;
  var SQRT2 = 1.4142135623730951;
  var F = [1];
  for (let n = 1; n <= 20; n++) F.push(F[n - 1] / n);
  var P2 = new Array(129);
  P2[64] = 1;
  for (let i = 1; i <= 64; i++) {
    P2[64 + i] = P2[63 + i] * 2;
    P2[64 - i] = P2[65 - i] / 2;
  }
  function sinSmall(r) {
    const r2 = r * r;
    return r * (F[0] - r2 * (F[3] - r2 * (F[5] - r2 * (F[7] - r2 * (F[9] - r2 * (F[11] - r2 * (F[13] - r2 * (F[15] - r2 * (F[17] - r2 * F[19])))))))));
  }
  function cosSmall(r) {
    const r2 = r * r;
    return F[0] - r2 * (F[2] - r2 * (F[4] - r2 * (F[6] - r2 * (F[8] - r2 * (F[10] - r2 * (F[12] - r2 * (F[14] - r2 * (F[16] - r2 * F[18]))))))));
  }
  function sin(x) {
    const k = Math.floor(x * TWO_OVER_PI + 0.5);
    const r = x - k * HALF_PI_HI - k * HALF_PI_LO;
    const q = (k % 4 + 4) % 4;
    return q === 0 ? sinSmall(r) : q === 1 ? cosSmall(r) : q === 2 ? -sinSmall(r) : -cosSmall(r);
  }
  function cos(x) {
    const k = Math.floor(x * TWO_OVER_PI + 0.5);
    const r = x - k * HALF_PI_HI - k * HALF_PI_LO;
    const q = (k % 4 + 4) % 4;
    return q === 0 ? cosSmall(r) : q === 1 ? -sinSmall(r) : q === 2 ? -cosSmall(r) : sinSmall(r);
  }
  function expSmall(x) {
    const k = Math.floor(x * INV_LN2 + 0.5);
    const r = x - k * LN2_HI - k * LN2_LO;
    let p = F[17];
    for (let n = 16; n >= 0; n--) p = p * r + F[n];
    return p * P2[64 + k];
  }
  function tanh(x) {
    if (x !== x) return NaN;
    const a = x < 0 ? -x : x;
    let t;
    if (a >= 20) t = 1;
    else if (a < 0.05) {
      const a2 = a * a;
      t = a * (1 - a2 * (1 / 3 - a2 * (2 / 15 - a2 * (17 / 315 - a2 * (62 / 2835 - a2 * (1382 / 155925))))));
    } else {
      const e = expSmall(-2 * a);
      t = (1 - e) / (1 + e);
    }
    return x < 0 ? -t : t;
  }
  function log(x) {
    if (!(x > 0)) return x === 0 ? -Infinity : NaN;
    if (x === Infinity) return Infinity;
    let m = x;
    let e = 0;
    while (m < SQRT_HALF) {
      m *= 2;
      e--;
    }
    while (m >= SQRT2) {
      m /= 2;
      e++;
    }
    const s = (m - 1) / (m + 1);
    const s2 = s * s;
    let p = 1 / 23;
    for (let n = 21; n >= 1; n -= 2) p = p * s2 + 1 / n;
    return e * LN2_HI + (e * LN2_LO + 2 * s * p);
  }

  // src/engine/rng.ts
  function createRng(seed) {
    let a = seed;
    const next = () => {
      a |= 0;
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const gauss = () => {
      const u = next() || 1e-9;
      const v = next();
      return Math.sqrt(-2 * log(u)) * cos(2 * Math.PI * v);
    };
    return { next, gauss };
  }

  // proto/game/sim.ts
  var SIZE = 400;
  var T = 800;
  var POP = 30;
  var EVERY = 5;
  var HELD = [101, 102];
  var SLICE = 40;
  var SEE = 150;
  var FLEE_AT = 60;
  var BITE = 6;
  var CATCH = 8;
  var HUNTER_SPEED = 1.9;
  var REST = 20;
  var HUNT_SEE = 120;
  var HUNGER = 15e-4;
  var MEAL = 0.3;
  var POISON = 0.35;
  var EMAX = 1.5;
  var SPECIES = [
    {
      id: "grazer",
      name: "Grazer",
      goal: "clean",
      speed: 2,
      hunger: 1,
      poisonHurt: 1,
      start: [],
      blurb: "Goal: clean food (food minus poison). Normal body."
    },
    {
      id: "sprinter",
      name: "Sprinter",
      goal: "alive",
      speed: 2.5,
      hunger: 1.5,
      poisonHurt: 1,
      start: ["hunter"],
      blurb: "Goal: stay alive. Fast, but gets hungry 1.5x faster. Starts able to see hunters."
    },
    {
      id: "scavenger",
      name: "Scavenger",
      goal: "eaten",
      speed: 2,
      hunger: 1,
      poisonHurt: 0.4,
      start: ["energy"],
      blurb: "Goal: swallow as much as possible, poison included. Poison hurts it only 40%. Starts able to feel its energy."
    }
  ];
  var goalValue = (s, g) => g === "clean" ? s.score : g === "eaten" ? s.good + s.bad : s.life;
  var SENSE_INFO = {
    poison: "see poison: direction and distance of the nearest poison bead",
    taste: "taste: was my last bite poison?",
    hunter: "see hunter: direction and distance of the nearest hunter",
    energy: "feel energy: how full am I?"
  };
  var newStats = () => ({ score: 0, good: 0, bad: 0, hunted: 0, starved: 0, life: 0 });
  function weighted(s, w, botGood) {
    const sum = w.eat + w.avoid + w.live || 1, we = w.eat / sum, wa = w.avoid / sum, wl = w.live / sum;
    return (we * s.good - wa * s.bad) / (botGood || 1) + wl * s.life / T;
  }
  var DEFAULT_SETTINGS = { reward: "balanced", mutation: 0.3, pop: POP };
  function fitness(s, r) {
    return r === "balanced" ? s.score : r === "glutton" ? s.good : s.life / 40;
  }
  var nIn = (b) => 3 + (b.includes("poison") ? 3 : 0) + (b.includes("taste") ? 1 : 0) + (b.includes("hunter") ? 3 : 0) + (b.includes("energy") ? 1 : 0);
  function gSize(nin, layers2, nout = 4) {
    let s = 0, prev = nin;
    for (const h of [...layers2, nout]) {
      s += prev * h + h;
      prev = h;
    }
    return s;
  }
  function think(g, inp, layers2, out, bufs) {
    let cur = inp, n = inp.length, k = 0;
    for (let l = 0; l < layers2.length; l++) {
      const nxt = bufs[l], m = layers2[l];
      for (let j = 0; j < m; j++) {
        let s = 0;
        for (let i = 0; i < n; i++) s += cur[i] * g[k++];
        nxt[j] = tanh(s + g[k++]);
      }
      cur = nxt;
      n = m;
    }
    for (let j = 0; j < out.length; j++) {
      let s = 0;
      for (let i = 0; i < n; i++) s += cur[i] * g[k++];
      out[j] = tanh(s + g[k++]);
    }
  }
  function wrap(d) {
    let x = d + 1.5 * SIZE;
    if (x >= 2 * SIZE) x -= 2 * SIZE;
    else if (x >= SIZE) x -= SIZE;
    return x - SIZE / 2;
  }
  var World = class {
    t = 0;
    r;
    fx = [];
    fy = [];
    bad = [];
    px = [];
    py = [];
    hx = [];
    hy = [];
    en = [];
    taste = [];
    alive = [];
    act = [];
    st = [];
    kx = [];
    ky = [];
    kdx = [];
    kdy = [];
    rest = [];
    b;
    inp = [];
    bufs;
    out = [0, 0, 0, 0];
    lv;
    rule;
    layers;
    genomes;
    sp;
    constructor(lv, rule, build, layers2, genomes, mapSeed, sp2 = SPECIES[0]) {
      this.sp = sp2;
      this.lv = lv;
      this.rule = rule;
      this.layers = layers2;
      this.genomes = genomes;
      const r = this.r = createRng(mapSeed);
      for (let i = 0; i < lv.good + lv.bad; i++) {
        this.fx.push(r.next() * SIZE);
        this.fy.push(r.next() * SIZE);
        this.bad.push(i >= lv.good);
      }
      for (let i = 0; i < genomes.length; i++) {
        this.px.push(r.next() * SIZE);
        this.py.push(r.next() * SIZE);
        const a = r.next() * 2 * Math.PI;
        this.hx.push(cos(a));
        this.hy.push(sin(a));
        this.en.push(1);
        this.taste.push(0);
        this.alive.push(true);
        this.act.push(3);
        this.st.push(newStats());
      }
      for (let i = 0; i < lv.hunters; i++) {
        this.kx.push(r.next() * SIZE);
        this.ky.push(r.next() * SIZE);
        const a = r.next() * 2 * Math.PI;
        this.kdx.push(cos(a));
        this.kdy.push(sin(a));
        this.rest.push(0);
      }
      this.b = rule ? lv.menu.filter((e) => e === "poison" || e === "hunter") : build;
      this.bufs = layers2.map((m) => new Array(m).fill(0));
    }
    get done() {
      return this.t >= T;
    }
    step() {
      const { lv, r, fx, fy, bad, px, py, hx, hy, en, taste, alive, st, kx, ky, kdx, kdy, rest, inp, out } = this;
      const nf = fx.length, n = px.length;
      const hasP = this.b.includes("poison"), hasT = this.b.includes("taste"), hasH = this.b.includes("hunter"), hasE = this.b.includes("energy");
      for (let i = 0; i < n; i++) {
        if (!alive[i]) continue;
        st[i].life++;
        let fi = -1, fd = SEE * SEE, pi = -1, pd = SEE * SEE, hi = -1, hd = SEE * SEE;
        for (let f = 0; f < nf; f++) {
          const dx = wrap(fx[f] - px[i]), dx2 = dx * dx;
          if (dx2 >= fd && (!bad[f] || dx2 >= pd)) continue;
          const dy = wrap(fy[f] - py[i]), d = dx2 + dy * dy;
          if (d < fd) {
            fd = d;
            fi = f;
          }
          if (bad[f] && d < pd) {
            pd = d;
            pi = f;
          }
        }
        for (let h = 0; h < lv.hunters; h++) {
          const dx = wrap(kx[h] - px[i]), dx2 = dx * dx;
          if (dx2 >= hd) continue;
          const dy = wrap(ky[h] - py[i]), d = dx2 + dy * dy;
          if (d < hd) {
            hd = d;
            hi = h;
          }
        }
        const toward = (tx, ty, k2, found) => {
          if (!found) {
            inp[k2] = 0;
            inp[k2 + 1] = 0;
            inp[k2 + 2] = 0;
            return k2 + 3;
          }
          const dx = wrap(tx - px[i]), dy = wrap(ty - py[i]), d = Math.sqrt(dx * dx + dy * dy) || 1;
          inp[k2] = (dx * hx[i] + dy * hy[i]) / d;
          inp[k2 + 1] = (-dx * hy[i] + dy * hx[i]) / d;
          inp[k2 + 2] = 1 - d / SEE;
          return k2 + 3;
        };
        let k = toward(fi >= 0 ? fx[fi] : 0, fi >= 0 ? fy[fi] : 0, 0, fi >= 0);
        if (hasP) k = toward(pi >= 0 ? fx[pi] : 0, pi >= 0 ? fy[pi] : 0, k, pi >= 0);
        if (hasT) inp[k++] = taste[i];
        if (hasH) k = toward(hi >= 0 ? kx[hi] : 0, hi >= 0 ? ky[hi] : 0, k, hi >= 0);
        if (hasE) inp[k++] = en[i] - 1;
        inp.length = k;
        let act = 3;
        if (this.rule) {
          if (hi >= 0 && hd < FLEE_AT * FLEE_AT) act = 2;
          else if (fi >= 0 && fi === pi && this.sp.goal !== "eaten") act = 1;
          else act = 0;
        } else {
          think(this.genomes[i], inp, this.layers, out, this.bufs);
          let best = -2;
          for (let a = 0; a < 4; a++) {
            if (a === 1 && !hasP || a === 2 && !hasH) continue;
            if (out[a] > best) {
              best = out[a];
              act = a;
            }
          }
        }
        this.act[i] = act;
        const face = (dx, dy) => {
          const d = Math.sqrt(dx * dx + dy * dy) || 1;
          hx[i] = dx / d;
          hy[i] = dy / d;
        };
        const turn = (a) => {
          const c = cos(a), s = sin(a), x = hx[i];
          hx[i] = x * c - hy[i] * s;
          hy[i] = x * s + hy[i] * c;
        };
        if (act === 0 && fi >= 0) face(wrap(fx[fi] - px[i]), wrap(fy[fi] - py[i]));
        else if (act === 1 && pi >= 0) face(-wrap(fx[pi] - px[i]), -wrap(fy[pi] - py[i]));
        else if (act === 2 && hi >= 0) face(-wrap(kx[hi] - px[i]), -wrap(ky[hi] - py[i]));
        else turn(r.gauss() * 0.2);
        const spd = this.sp.speed;
        px[i] = (px[i] + hx[i] * spd + SIZE) % SIZE;
        py[i] = (py[i] + hy[i] * spd + SIZE) % SIZE;
        if (fi >= 0) {
          const dx = wrap(fx[fi] - px[i]), dy = wrap(fy[fi] - py[i]);
          if (dx * dx + dy * dy < BITE * BITE) {
            if (bad[fi]) {
              en[i] -= POISON * this.sp.poisonHurt;
              st[i].bad++;
              st[i].score--;
              taste[i] = 1;
            } else {
              en[i] = Math.min(EMAX, en[i] + MEAL);
              st[i].good++;
              st[i].score++;
              taste[i] = -1;
            }
            fx[fi] = r.next() * SIZE;
            fy[fi] = r.next() * SIZE;
          }
        }
        en[i] -= HUNGER * this.sp.hunger;
        if (en[i] <= 0) {
          alive[i] = false;
          st[i].starved = 1;
        }
      }
      for (let h = 0; h < lv.hunters; h++) {
        if (rest[h] > 0) {
          rest[h]--;
          continue;
        }

          const [nm, ...rest] = SENSE_INFO[x].split(": ");
          const locked = tut() && x !== TUTORIAL[stage].must;
          const b = el("button", "choice" + (pick === x ? " on" : "") + (locked ? " locked" : ""), `<b>${nm}${locked ? " (try it in Normal)" : ""}</b><small>${rest.join(": ")}</small>`);
          b.disabled = locked;
          b.onclick = () => {
            pick = x;
            renderPanel();
          };
          ch.appendChild(b);
        }
        P.appendChild(ch);
      }
      P.appendChild(el("h2", "", "Reward: what evolution scores"));
      if (tut()) P.appendChild(el("p", "muted", "Locked at 50 eat / 50 avoid in the tutorial: that is exactly the grazer's goal. In Normal you can change it."));
      P.appendChild(sliders(tut()));
      const row2 = el("div", "row");
      row2.appendChild(button(`Evolve ${BUDGET} generations`, startStage, "primary", stage > 0 && !pick));
      row2.appendChild(button("Quit run", () => {
        endRun();
      }));
      P.appendChild(row2);
      return;
    }
    if (mode === "running") {
      P.appendChild(el("p", "", `Senses: food + ${buildNow().join(" + ") || "nothing else"}.`));
      P.appendChild(el("div", "reason", "Evolving\u2026"));
      P.appendChild(el("p", "muted")).id = "runInfo";
      P.appendChild(el("div", "row")).appendChild(button("Quit run", () => {
        send({ type: "stop" });
        endRun();
      }));
      return;
    }
    if (mode === "result") {
      const rec = run.stages[stage];
      P.appendChild(el("div", "verdict " + (rec.pass ? "pass" : "fail"), rec.pass ? `Cleared: ${rec.score.toFixed(2)} \u2265 ${bar()}` : `Failed: ${rec.score.toFixed(2)} < ${bar()}`));
      if (last) P.appendChild(el("div", "reason", reason(s, lv, rec.build, last.champStats, last.ruleStats, rec.score, bar(), rec.weights)));
      if (tut() && rec.pass) P.appendChild(el("p", "", "\u{1F4A1} " + TUTORIAL[stage].after));
      const row2 = el("div", "row");
      if (rec.pass && stage < STAGES.length - 1) row2.appendChild(button("Next stage", nextStage, "primary"));
      else row2.appendChild(button("See run summary", () => {
        mode = "summary";
        renderAll();
      }, "primary"));
      if (rec.pass && stage < STAGES.length - 1) row2.appendChild(button("Quit run", () => endRun()));
      P.appendChild(row2);
      return;
    }
    const cleared = run.stages.filter((x) => x.pass).length;
    P.appendChild(el("div", "verdict " + (cleared === STAGES.length ? "pass" : "fail"), cleared === STAGES.length ? "Run complete: all stages cleared" : `Run over: ${cleared} of ${STAGES.length} stages cleared`));
    P.appendChild(el("p", "", `Creds earned: ${run.creds}. Same species, seed and choices always give the same run.`));
    const row = el("div", "row");
    if (run.tutorial) row.appendChild(button("Start a Normal run", () => {
      home();
      spIdx = 0;
      tutorial = false;
      startRun();
    }, "primary"));
    row.appendChild(button("Back to start", home, run.tutorial ? "" : "primary"));
    P.appendChild(row);
  }
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function renderDashboard() {
    $("tStage").textContent = run ? `${stage + 1} / ${STAGES.length}` : "-";
    $("tGen").textContent = last ? `${last.gen} / ${BUDGET}` : "-";
    $("tScore").textContent = checks.length ? stageScore(checks.map((c) => c.progress)).toFixed(2) : run?.stages[stage] ? run.stages[stage].score.toFixed(2) : "-";
    $("tBar").textContent = run || mode === "home" ? String(bar()) : "-";
    drawChart();
    const tb = $("runs");
    tb.innerHTML = "";
    for (const r of [...save.runs].reverse()) {
      const tr = document.createElement("tr");
      const senses = r.stages.length ? r.stages[r.stages.length - 1].build.join(" + ") || "food only" : "-";
      const cells = [String(r.n), SPECIES[r.sp].name + (r.tutorial ? " (tutorial)" : ""), String(r.seed), senses, r.stages.map((x) => x.score.toFixed(2) + (x.pass ? "" : "\u2717")).join("  "), `${r.stages.filter((x) => x.pass).length}/${STAGES.length}${r.over ? "" : " \u2026"}`, String(r.creds)];
      for (const c of cells) {
        const td = document.createElement("td");
        td.textContent = c;
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
  }
  function drawChart() {
    const cv = $("chart");
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
    const g = cv.getContext("2d");
    g.scale(dpr, dpr);
    g.clearRect(0, 0, W, H);
    const L = 40, R = 12, T2 = 10, B = 26, total = BUDGET * STAGES.length, maxY = 1.4;
    const X = (gen) => L + gen / total * (W - L - R), Y = (v) => T2 + (1 - Math.max(0, Math.min(maxY, v)) / maxY) * (H - T2 - B);
    g.font = "11px system-ui, sans-serif";
    g.lineWidth = 1;
    for (const v of [0, 0.5, 1]) {
      g.strokeStyle = css("--line");
      g.beginPath();
      g.moveTo(L, Y(v));
      g.lineTo(W - R, Y(v));
      g.stroke();
      g.fillStyle = css("--muted");
      g.fillText(v.toFixed(1), 8, Y(v) + 4);
    }
    STAGES.forEach((st, i) => {
      const x0 = X(i * BUDGET), x1 = X((i + 1) * BUDGET);
      g.fillStyle = css("--muted");
      g.fillText(st.name, x0 + 4, H - 8);
      if (i) {
        g.strokeStyle = css("--line");
        g.beginPath();
        g.moveTo(x0, T2);
        g.lineTo(x0, H - B);
        g.stroke();
      }
      g.setLineDash([5, 4]);
      g.strokeStyle = css("--warn");
      g.beginPath();
      g.moveTo(x0, Y(bar(i)));
      g.lineTo(x1, Y(bar(i)));
      g.stroke();
      g.setLineDash([]);
      const hist = run?.stages[i]?.hist ?? (i === stage && checks.length ? checks.map((c) => c.progress) : null);
      if (!hist) return;
      const pts = (h) => h.map((v, k) => [X(i * BUDGET + (k + 1) * 5), Y(v)]);
      g.strokeStyle = "rgba(43,92,158,.3)";
      g.lineWidth = 1.5;
      g.beginPath();
      pts(hist).forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y));
      g.stroke();
      const avg = hist.map((_, k) => stageScore(hist.slice(0, k + 1)));
      g.strokeStyle = css("--accent");
      g.lineWidth = 2.5;
      g.beginPath();
      pts(avg).forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y));
      g.stroke();
    });
    g.fillStyle = css("--muted");
    g.fillText("thick: average of last 4 checks \xB7 faint: single checks \xB7 dashed: pass bar", L + 4, T2 + 10);
  }
  var replay = null;
  var replayOf = "bot";
  var lastFrame = performance.now();
  var owed = 0;
  function nextReplay() {
    const lv = STAGES[stage], s = sp();
    if (watch === "best" && champ) {
      replayOf = "best";
      return new World(lv, false, buildNow(), run ? run.layers : layers, Array.from({ length: POP }, () => champ), HELD[0], s);
    }
    replayOf = "bot";
    return new World(lv, true, [], [], Array.from({ length: POP }, () => []), HELD[0], s);
  }
  function drawWorld(w) {
    const cv = $("world");
    const dpr = window.devicePixelRatio || 1, S = cv.clientWidth || 400;
    if (cv.width !== Math.round(S * dpr)) {
      cv.width = Math.round(S * dpr);
      cv.height = Math.round(S * dpr);
    }
    const g = cv.getContext("2d");
    g.setTransform(S * dpr / 400, 0, 0, S * dpr / 400, 0, 0);
    g.fillStyle = css("--field");
    g.fillRect(0, 0, 400, 400);
    for (let f = 0; f < w.fx.length; f++) {
      g.beginPath();
      g.arc(w.fx[f], w.fy[f], 3.2, 0, Math.PI * 2);
      g.fillStyle = w.bad[f] ? css("--poison") : css("--food");
      g.fill();
      if (!w.bad[f]) {
        g.strokeStyle = css("--food-rim");
        g.lineWidth = 1;
        g.stroke();
      }
    }
    const colors = [css("--eat"), css("--avoid"), css("--flee"), css("--wander")];
    for (let i = 0; i < w.px.length; i++) {
      if (!w.alive[i]) continue;
      g.fillStyle = colors[w.act[i]];
      g.beginPath();
      g.arc(w.px[i], w.py[i], 5, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = colors[w.act[i]];
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(w.px[i], w.py[i]);
      g.lineTo(w.px[i] + w.hx[i] * 9, w.py[i] + w.hy[i] * 9);
      g.stroke();
    }
    g.fillStyle = css("--hunter");
    for (let h = 0; h < w.kx.length; h++) {
      const x = w.kx[h], y = w.ky[h], dx = w.kdx[h], dy = w.kdy[h];
      g.beginPath();
      g.moveTo(x + dx * 9, y + dy * 9);
      g.lineTo(x - dx * 6 - dy * 6, y - dy * 6 + dx * 6);
      g.lineTo(x - dx * 6 + dy * 6, y - dy * 6 - dx * 6);
      g.closePath();
      g.fill();
    }
    const alive = w.alive.filter(Boolean).length;
    $("watchTitle").textContent = `${replayOf === "best" ? `Best brain (generation ${last?.gen ?? 0})` : "Hand-written bot"} \xB7 ${STAGES[stage].name} \xB7 tick ${w.t}/800 \xB7 alive ${alive}/${POP}`;
  }
  function frame() {
    const want = watch === "best" && champ ? "best" : "bot";
    if (!replay || replay.done || replayOf !== want) replay = nextReplay();
    const now = performance.now(), dt = Math.min(100, now - lastFrame);
    owed += dt / 1e3 * (speed === "fast" ? 960 : 240);
    for (; owed >= 1 && !replay.done; owed--) replay.step();
    lastFrame = now;
    drawWorld(replay);
    $("watchNote").textContent = want === "bot" ? "Showing the hand-written bot on a map evolution never trains on. Once a stage runs, the best brain so far plays here." : "The best brain so far plays a map it never trained on.";
    requestAnimationFrame(frame);
  }
  var toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => t.classList.remove("show"), 1800);
  }
  function renderAll() {
    $("wallet").textContent = `Creds: ${wallet()}`;
    renderPanel();
    renderDashboard();
  }
  $("watchBest").onclick = () => {
    watch = "best";
    $("watchBest").className = "on";
    $("watchBot").className = "";
    replay = null;
  };
  $("watchBot").onclick = () => {
    watch = "bot";
    $("watchBot").className = "on";
    $("watchBest").className = "";
    replay = null;
  };
  $("speed").onclick = () => {
    speed = speed === "normal" ? "fast" : "normal";
    $("speed").textContent = speed;
  };
  window.addEventListener("resize", () => renderDashboard());
  for (const r of save.runs) r.over = true;
  if (save.runs.some((x) => x.tutorial && x.stages.length === STAGES.length && x.stages.every((st) => st.pass))) tutorial = false;
  renderAll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
